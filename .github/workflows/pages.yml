name: Update Deye dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Read Deye and build public files
        run: npm run build:pages
        env:
          DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
          DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
          DEYE_LOGIN: ${{ secrets.DEYE_LOGIN }}
          DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          DEYE_STATION_ID: ${{ vars.DEYE_STATION_ID }}
          DEYE_STATION_NAME: ${{ vars.DEYE_STATION_NAME }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
